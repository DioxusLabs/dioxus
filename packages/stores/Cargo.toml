[package]
name = "dioxus-stores"
version = { workspace = true }
edition = "2024"
repository = "https://github.com/DioxusLabs/dioxus/"
homepage = "https://dioxuslabs.com/docs/0.5/guide/en/getting_started/fullstack.html"
keywords = ["dom", "ui", "gui", "react", "liveview"]
authors = ["Jonathan Kelley", "Evan Almloff"]
license = "MIT OR Apache-2.0"
description = "Server function macros for Dioxus"

[dependencies]
dioxus-core = { workspace = true }
dioxus-signals = { workspace = true }
dioxus-stores-macro = { workspace = true, optional = true }
generational-box.workspace = true

[dev-dependencies]
dioxus = { workspace = true }
trybuild = { workspace = true }
dioxus-stores-visibility-helper = { path = "tests/visibility-helper" }

[features]
default = ["macro"]
macro = ["dep:dioxus-stores-macro"]
large-path = []

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[package.metadata.cargo-semver-checks.lints]
workspace = true
# `Store<T, Lens>` has several inherent impl blocks (slice, HashMap, BTreeMap) that define a
# method named `get` with different receivers. cargo-semver-checks matches methods by
# type + name only, so it reports a receiver change even when nothing moved.
method_receiver_ref_became_owned = "allow"

[package]
name = "dioxus-core"
version = { workspace = true }
authors = ["Jonathan Kelley", "Dioxus Labs", "ealmloff"]
edition = "2024"
description = "Core building blocks for Dioxus user interfaces"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/dioxus/"
homepage = "https://dioxuslabs.com"
rust-version = "1.85.0"

[dependencies]
dioxus-vdom = { workspace = true }
dioxus-vdom-macro = { workspace = true }
dioxus-vdom-template = { workspace = true }
dioxus-rsx = { workspace = true }
dioxus-signals = { workspace = true, optional = true }
dioxus-hooks = { workspace = true, optional = true }
dioxus-stores = { workspace = true, optional = true }
dioxus-stores-macro = { workspace = true, optional = true }
dioxus-ssr = { workspace = true, optional = true }
dioxus-html = { workspace = true, optional = true }
dioxus-html-internal-macro = { workspace = true, optional = true }
dioxus-document = { workspace = true, optional = true }

[features]
default = ["macro", "signals", "hooks", "stores", "html", "document"]
macro = []
signals = ["dep:dioxus-signals"]
hooks = ["dep:dioxus-hooks"]
stores = ["dep:dioxus-stores", "dep:dioxus-stores-macro"]
ssr = ["dep:dioxus-ssr"]
html = ["dep:dioxus-html", "dep:dioxus-html-internal-macro"]
document = ["dep:dioxus-document"]

[package]
name = "dioxus-test-harness-macro"
edition = "2024"
version.workspace = true
publish = true
authors = ["Jonathan Kelley"]
description = "Proc macro for the Dioxus test harness"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/dioxus/"
homepage = "https://dioxuslabs.com/learn/0.7/"
keywords = ["dom", "ui", "gui", "react", "test"]
rust-version = "1.85.0"

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true, features = ["full"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }

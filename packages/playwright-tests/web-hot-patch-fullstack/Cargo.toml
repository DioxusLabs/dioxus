[package]
name = "dioxus-playwright-fullstack-patch-test"
version = "0.0.1"
edition = "2024"
description = "Playwright test for Dioxus Web"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
dioxus = { path = "../../dioxus", features = ["fullstack"] }
# This fixture has its own lockfile; use the version validated by the Dioxus workspace.
wasm-bindgen = { version = "=0.2.121" }

[features]
web = ["dioxus/web"]
server = ["dioxus/server"]

[workspace]

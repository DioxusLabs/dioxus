[package]
name = "dioxus-playwright-web-patch-test"
version = "0.0.1"
edition = "2024"
description = "Playwright test for Dioxus Web"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
dioxus = { path = "../../dioxus", features = ["web"] }
# This standalone workspace cannot inherit the root dependency or lockfile.
# Pin wasm-bindgen to the version in the root lockfile.
wasm-bindgen = { version = "=0.2.121" }
web-sys = { version = "*", features = ["MouseEvent"] }

[workspace]

# Classifies the public-API impact of a PR with cargo-semver-checks.
#
# Every publishable library crate is compared against main (the PR's merge-base) and
# sorted into one of three buckets:
#   - compatible: no public API changes
#   - expanding:  API was added (fine, but can't be backported in a patch release)
#   - breaking:   API was removed or changed
#
# Breaking crates get a second look against their last crates.io release. If main was
# *already* incompatible with crates.io, the break is reported but allowed (main has
# diverged, the door is already shut). If main was still compatible, this PR is the one
# closing the door and the job fails. Add the `allow-breaking` label to the PR to
# acknowledge that and turn the failure into a warning.
#
# The verdict is applied to the PR as one of the `semver: breaking` / `semver: expanding` /
# `semver: compatible` labels; the detailed report is in the job log and job summary.

name: Semver

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    branches:
      - main
    paths:
      - "packages/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/semver.yml"
      - ".github/scripts/semver-check.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # cargo-semver-checks builds rustdoc for every crate in its own placeholder project. Pinning
  # the target dir makes all of them (and the baseline checkout) share one dependency build.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  semver:
    # Re-run on label events only for the acknowledgement label, not for the labels this job applies.
    if: |
      github.event.pull_request.draft == false &&
      (!contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) || github.event.label.name == 'allow-breaking')
    name: "Semver | Classify API changes"
    runs-on: warp-ubuntu-latest-x64-8x
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Checkout baseline (main)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libudev-dev libayatana-appindicator3-dev libxdo-dev libglib2.0-dev
          version: 1.0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-semver-checks
        run: cargo binstall cargo-semver-checks -y --force --locked

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-provider: "warpbuild"
          workspaces: ". -> target"

      - name: Check semver
        id: check
        run: |
          # The baseline checkout can't live inside the PR workspace: cargo-semver-checks
          # would discover duplicate package manifests (e.g. baseline/packages/* shadows
          # packages/*) and fail with "package is ambiguous". Move it next to the workspace.
          mv "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/../baseline"
          python3 .github/scripts/semver-check.py \
            --baseline-root "$GITHUB_WORKSPACE/../baseline" \
            --json semver-report.json \
            ${{ contains(github.event.pull_request.labels.*.name, 'allow-breaking') && '--allow-breaking' || '' }}

      - name: Label PR
        if: always() && steps.check.outcome != 'skipped' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const labels = {
              'fresh-break': { name: 'semver: breaking',   color: 'b60205', description: 'Breaking public API change' },
              'breaking':    { name: 'semver: breaking',   color: 'b60205', description: 'Breaking public API change' },
              'expanding':   { name: 'semver: expanding',  color: '0e8a16', description: 'Adds public API (not backportable in a patch)' },
              'compatible':  { name: 'semver: compatible', color: 'c5def5', description: 'No public API changes' },
            };
            let verdict;
            try {
              verdict = JSON.parse(fs.readFileSync('semver-report.json', 'utf8')).verdict;
            } catch {
              core.warning('no semver report produced; leaving labels untouched');
              return;
            }
            const want = labels[verdict];
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const current = (await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number })).data.map(l => l.name);
            for (const stale of current.filter(n => n.startsWith('semver: ') && n !== want.name)) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: stale });
            }
            if (current.includes(want.name)) return;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: want.name });
            } catch {
              await github.rest.issues.createLabel({ owner, repo, ...want });
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [want.name] });
